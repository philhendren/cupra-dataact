<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Mock-up: the options dialog</title>
  <rect width="620" height="420" fill="#5f6368"/>
  <rect x="30" y="30" width="560" height="360" rx="16" fill="#fff"/>
  <text x="58" y="76" font-size="20" fill="#212121">Options</text>
  <text x="58" y="116" font-size="14" fill="#212121">Poll interval</text>
  <line x1="58" y1="146" x2="470" y2="146" stroke="#b3e5fc" stroke-width="4" stroke-linecap="round"/>
  <line x1="58" y1="146" x2="99" y2="146" stroke="#03a9f4" stroke-width="4" stroke-linecap="round"/>
  <circle cx="99" cy="146" r="9" fill="#03a9f4"/>
  <rect x="490" y="128" width="72" height="36" rx="4" fill="#f5f5f5"/>
  <text x="504" y="152" font-size="15" fill="#212121">5</text><text x="548" y="152" font-size="13" fill="#727272" text-anchor="end">min</text>
  <g font-size="12" fill="#727272">
    <text x="58" y="186">How often to check the portal for new datasets. New data arrives at most every</text>
    <text x="58" y="202">15 minutes.</text>
  </g>
  <rect x="58" y="226" width="504" height="56" rx="4" fill="#f5f5f5"/>
  <line x1="58" y1="282" x2="562" y2="282" stroke="#03a9f4" stroke-width="2"/>
  <text x="74" y="248" font-size="12" fill="#03a9f4">Live battery level sensor (optional)</text>
  <text x="74" y="270" font-size="16" fill="#212121">WiCAN Born SoC</text>
  <text x="300" y="270" font-size="12" fill="#9e9e9e">sensor.wican_born_soc</text>
  <path d="M536 252 l6 6 l6 -6" stroke="#727272" stroke-width="2" fill="none"/>
  <g font-size="12" fill="#727272">
    <text x="58" y="306">For example an OBD dongle (WiCAN) or wallbox SoC sensor. Adds a 'Battery level</text>
    <text x="58" y="322">(best)' sensor that uses whichever value is fresher.</text>
  </g>
  <text x="562" y="366" font-size="14" font-weight="500" fill="#03a9f4" text-anchor="end">SUBMIT</text>
  <text x="58" y="366" font-size="11" fill="#9e9e9e">MOCK-UP</text>
</svg>
