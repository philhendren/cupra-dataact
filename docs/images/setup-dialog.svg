<svg xmlns="http://www.w3.org/2000/svg" width="620" height="560" viewBox="0 0 620 560" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Mock-up: the setup dialog</title>
  <rect width="620" height="560" fill="#5f6368"/>
  <rect x="30" y="30" width="560" height="500" rx="16" fill="#fff"/>
  <text x="58" y="76" font-size="20" fill="#212121">Connect via the EU Data Act portal</text>
  <path d="M556 60 l12 12 M568 60 l-12 12" stroke="#727272" stroke-width="2"/>
  <g font-size="14" fill="#5f5f5f">
    <text x="58" y="112">Use your CUPRA ID (My CUPRA app) credentials. First, in a browser at</text>
    <text x="58" y="132"><tspan fill="#03a9f4">eu-data-act.drivesomethinggreater.com</tspan>: sign in, accept the consent</text>
    <text x="58" y="152">screen, link your car and create a continuous data request (every</text>
    <text x="58" y="172">15 minutes). Data is read-only and lags the car by 15 minutes or more.</text>
  </g>
  <!-- email -->
  <rect x="58" y="200" width="504" height="56" rx="4" fill="#f5f5f5"/>
  <line x1="58" y1="256" x2="562" y2="256" stroke="#9e9e9e"/>
  <text x="74" y="222" font-size="12" fill="#727272">Email*</text>
  <text x="74" y="244" font-size="16" fill="#212121">you@example.com</text>
  <!-- password -->
  <rect x="58" y="276" width="504" height="56" rx="4" fill="#f5f5f5"/>
  <line x1="58" y1="332" x2="562" y2="332" stroke="#9e9e9e"/>
  <text x="74" y="298" font-size="12" fill="#727272">Password*</text>
  <text x="74" y="321" font-size="18" fill="#212121" letter-spacing="2">••••••••••••</text>
  <path d="M528 306 q12 -10 24 0 q-12 10 -24 0 z" fill="none" stroke="#727272" stroke-width="1.6"/><circle cx="540" cy="306" r="3" fill="#727272"/>
  <!-- brand -->
  <rect x="58" y="352" width="504" height="56" rx="4" fill="#f5f5f5"/>
  <line x1="58" y1="408" x2="562" y2="408" stroke="#9e9e9e"/>
  <text x="74" y="374" font-size="12" fill="#727272">Brand*</text>
  <text x="74" y="396" font-size="16" fill="#212121">CUPRA</text>
  <path d="M536 378 l6 6 l6 -6" stroke="#727272" stroke-width="2" fill="none"/>
  <!-- error example -->
  <rect x="58" y="424" width="504" height="40" rx="4" fill="#fdecea"/>
  <circle cx="78" cy="444" r="8" fill="#db4437"/><text x="78" y="449" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">!</text>
  <text x="96" y="449" font-size="13" fill="#8a1c12">No vehicle is linked on the portal. Link your car there first.</text>
  <!-- button -->
  <text x="562" y="504" font-size="14" font-weight="500" fill="#03a9f4" text-anchor="end">SUBMIT</text>
  <text x="58" y="504" font-size="11" fill="#9e9e9e">MOCK-UP</text>
</svg>
